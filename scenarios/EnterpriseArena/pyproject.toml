[project]
name = "agentx"
version = "0.1.0"
description = "Enterprise MCP tool usage scenario for AgentBeats"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk==0.3.20",
    "earthshaker>=0.2.1",
    "httpx==0.28.1",
    "langchain==0.3.23",
    "langchain-core==0.3.76",
    "langchain-mcp-adapters==0.1.9",
    "langchain-openai==0.3.1",
    "langgraph==0.3.30",
    "pydantic==2.11.7",
    "python-dotenv>=1.2.1",
    "uvicorn==0.34.3",
]
[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]